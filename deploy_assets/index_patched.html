<!DOCTYPE html><html><head><link href=/jquery/static/css/app.de42dc3.css rel=stylesheet></head><body data-theme=light><div id=app></div><script type=text/javascript src=/jquery/static/js/manifest.ff52723.js></script><script type=text/javascript src=/jquery/static/js/vendor.e33bc37.js></script><script type=text/javascript src=/jquery/static/js/app.265073a.js></script><script>
(function() {
  var currentHost = window.location.hostname || '192.168.1.2';
  var iptvBaseUrl = 'http://' + currentHost + ':4022';
  var committed = (localStorage.getItem('iptv_plugin_state') !== '0');
  var pending = committed;

  // Sync state from backend if reachable
  function syncBackendState() {
    try {
      fetch(iptvBaseUrl + '/api/plugin/state', { mode: 'cors' })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (typeof d.enabled === 'boolean') {
            committed = d.enabled;
            pending = committed;
            localStorage.setItem('iptv_plugin_state', committed ? '1' : '0');
            renderSwitch(committed);
          }
        })
        .catch(function() {});
    } catch(e) {}
  }

  function renderSwitch(state) {
    var sw = document.getElementById('iptv-ui-switch');
    var chk = document.getElementById('iptv-ui-checkbox');
    var alertRow = document.getElementById('iptv-alert-row');
    if (!sw || !chk || !alertRow) return;

    if (state) {
      sw.classList.add('is-checked');
      sw.setAttribute('aria-checked', 'true');
      chk.checked = true;
      alertRow.style.display = 'block';
    } else {
      sw.classList.remove('is-checked');
      sw.setAttribute('aria-checked', 'false');
      chk.checked = false;
      alertRow.style.display = 'none';
    }
  }

  function initIptvTab() {
    if (!window.location.hash.includes('/app/application')) return;
    var uuTab = document.getElementById('tab-UUplugin');
    if (!uuTab) return;

    var nav = uuTab.parentElement;
    if (!nav) return;
    var tabsWrap = nav.closest('.el-tabs');
    var content = tabsWrap ? tabsWrap.querySelector('.el-tabs__content') : null;
    if (!content) return;

    // Adjust all tab widths to 25% for 4 tabs
    var activeBar = nav.querySelector('.el-tabs__active-bar');
    if (activeBar) {
      activeBar.style.width = '25%';
    }
    nav.querySelectorAll('.el-tabs__item').forEach(function(item) {
      item.style.width = '25%';
      item.style.textAlign = 'center';
    });

    if (document.getElementById('tab-IPTVplugin')) return;

    // 1. Create 4th Tab: "IPTV插件"
    var iptvTab = document.createElement('div');
    iptvTab.id = 'tab-IPTVplugin';
    iptvTab.setAttribute('role', 'tab');
    iptvTab.setAttribute('tabindex', '-1');
    iptvTab.className = 'el-tabs__item is-top';
    iptvTab.innerText = 'IPTV插件';
    iptvTab.style.width = '25%';
    iptvTab.style.textAlign = 'center';
    iptvTab.style.cursor = 'pointer';

    nav.appendChild(iptvTab);

    // 2. Create 4th Tab Pane: "pane-IPTVplugin"
    var iptvPane = document.createElement('div');
    iptvPane.id = 'pane-IPTVplugin';
    iptvPane.setAttribute('role', 'tabpanel');
    iptvPane.setAttribute('aria-hidden', 'true');
    iptvPane.className = 'el-tab-pane subPage';
    iptvPane.style.display = 'none';

    iptvPane.innerHTML = [
      '<form class="el-form el-form--label-top">',
      '  <div class="el-form-item is-no-asterisk">',
      '    <div class="el-form-item__content">',
      '      <span class="spanwsty">开关</span>',
      '      <div role="switch" id="iptv-ui-switch" aria-checked="true" class="el-switch is-checked" style="cursor: pointer;">',
      '        <input type="checkbox" id="iptv-ui-checkbox" class="el-switch__input" checked>',
      '        <span class="el-switch__core" style="width: 40px;"></span>',
      '      </div>',
      '    </div>',
      '  </div>',
      '  <div id="iptv-alert-row" class="el-form-item is-no-asterisk" style="display: block;">',
      '    <div class="el-form-item__content">',
      '      <div role="alert" class="el-alert is-light" style="background: #e6f5fe; border: 1px solid #92d4ff; border-radius: 6px; padding: 10px 16px; display: flex; align-items: center;">',
      '        <i class="el-alert__icon el-icon-warning is-big" style="color: #04affa; font-size: 20px; margin-right: 12px; flex-shrink: 0;"></i>',
      '        <div class="el-alert__content" style="padding: 0;">',
      '          <p class="el-alert__description" style="margin: 0; line-height: 1.5;">',
      '            <span style="color: #222; font-size: 13px;">首次打开插件，请点击链接：</span>',
      '            <a id="iptv-entry-link" href="' + iptvBaseUrl + '" target="_blank" class="text-blue text-href" style="color: #04affa; text-decoration: underline; margin: 0 4px; font-size: 13px; font-weight: 500;">IPTV插件</a>',
      '            <span style="color: #222; font-size: 13px;">进入IPTV插件设置页面。</span>',
      '          </p>',
      '        </div>',
      '      </div>',
      '    </div>',
      '  </div>',
      '  <div id="iptv-success-card" class="el-card cardStyle is-never-shadow" style="background: rgb(246, 255, 236); display: none; margin-bottom: 22px;">',
      '    <div class="el-card__body">',
      '      <div style="font-size: 14px; color: #67c23a; display: flex; align-items: center;">',
      '        <img src="/jquery/static/img/home/complete_16.png" style="margin-right: 10px;">',
      '        <span>提交成功！</span>',
      '      </div>',
      '    </div>',
      '  </div>',
      '  <div class="el-form-item btnRow is-no-asterisk">',
      '    <div class="el-form-item__content">',
      '      <button type="button" id="iptv-submit-btn" class="el-button el-button--primary">',
      '        <span>提交</span>',
      '      </button>',
      '    </div>',
      '  </div>',
      '</form>'
    ].join('');

    content.appendChild(iptvPane);

    // Initial render & sync
    pending = committed;
    renderSwitch(committed);
    syncBackendState();

    // 3. Switch Click: Only toggles pending visual state; does NOT take effect until Submit
    var sw = document.getElementById('iptv-ui-switch');
    if (sw) {
      sw.onclick = function(e) {
        e.preventDefault();
        pending = !pending;
        renderSwitch(pending);
      };
    }

    // 4. Submit Button Click: Takes effect, commits state & calls backend API
    var submitBtn = document.getElementById('iptv-submit-btn');
    if (submitBtn) {
      submitBtn.onclick = function(e) {
        e.preventDefault();
        committed = pending;
        localStorage.setItem('iptv_plugin_state', committed ? '1' : '0');

        // Notify backend service
        try {
          var targetAction = committed ? 'enable' : 'disable';
          fetch(iptvBaseUrl + '/api/plugin/' + targetAction, { method: 'POST', mode: 'cors' }).catch(function(){});
        } catch(ex) {}

        // Show success notification card
        var card = document.getElementById('iptv-success-card');
        if (card) {
          card.style.display = 'block';
          setTimeout(function() {
            card.style.display = 'none';
          }, 2500);
        }

        // Trigger Element UI toast if available
        try {
          if (window.ELEMENT && window.ELEMENT.Message) {
            window.ELEMENT.Message({ message: '提交成功！', type: 'success' });
          } else if (document.querySelector('#app') && document.querySelector('#app').__vue__ && document.querySelector('#app').__vue__.$message) {
            document.querySelector('#app').__vue__.$message({ message: '提交成功！', type: 'success' });
          }
        } catch(ex) {}
      };
    }

    // 5. Native tab pane IDs mapping
    var nativeTabMap = {
      'tab-UUplugin': 'pane-UUplugin',
      'tab-OWDplugin': 'pane-OWDplugin',
      'tab-JDXBplugin': 'pane-JDXBplugin'
    };

    // 6. Tab Select Handler for IPTV Tab
    function selectIptvTab() {
      // Discard unsubmitted switch toggles on tab activate
      pending = committed;
      renderSwitch(committed);

      // Deselect all native tabs
      nav.querySelectorAll('.el-tabs__item').forEach(function(item) {
        item.classList.remove('is-active');
        item.setAttribute('aria-selected', 'false');
        item.setAttribute('tabindex', '-1');
        item.style.width = '25%';
      });

      // Explicitly hide all native panes
      Object.keys(nativeTabMap).forEach(function(tid) {
        var pid = nativeTabMap[tid];
        var p = document.getElementById(pid);
        if (p) {
          p.style.display = 'none';
          p.setAttribute('aria-hidden', 'true');
        }
      });

      // Show IPTV pane
      iptvTab.classList.add('is-active');
      iptvTab.setAttribute('aria-selected', 'true');
      iptvTab.setAttribute('tabindex', '0');
      iptvPane.style.display = 'block';
      iptvPane.setAttribute('aria-hidden', 'false');

      if (activeBar) {
        activeBar.style.width = '25%';
        activeBar.style.transform = 'translateX(300%)';
      }
    }

    iptvTab.onclick = selectIptvTab;

    // 7. Click Handlers for Native Tabs (UU, 玩辰, 节点小宝)
    nav.querySelectorAll('.el-tabs__item').forEach(function(item, idx) {
      if (item === iptvTab) return;
      item.addEventListener('click', function() {
        // Deselect IPTV tab and hide IPTV pane
        iptvTab.classList.remove('is-active');
        iptvTab.setAttribute('aria-selected', 'false');
        iptvPane.style.display = 'none';
        iptvPane.setAttribute('aria-hidden', 'true');
        pending = committed;
        renderSwitch(committed);

        // Explicitly activate the clicked native tab & show its corresponding pane
        var targetPaneId = nativeTabMap[item.id] || item.getAttribute('aria-controls') || item.id.replace('tab-', 'pane-');
        var targetPane = document.getElementById(targetPaneId);
        if (targetPane) {
          targetPane.style.display = 'block';
          targetPane.setAttribute('aria-hidden', 'false');
        }

        // Hide other native panes
        Object.keys(nativeTabMap).forEach(function(tid) {
          var otherPid = nativeTabMap[tid];
          if (otherPid !== targetPaneId) {
            var otherP = document.getElementById(otherPid);
            if (otherP) {
              otherP.style.display = 'none';
              otherP.setAttribute('aria-hidden', 'true');
            }
          }
        });

        // Ensure 25% width and reposition active bar
        setTimeout(function() {
          nav.querySelectorAll('.el-tabs__item').forEach(function(t) {
            t.style.width = '25%';
          });
          if (activeBar) {
            activeBar.style.width = '25%';
            activeBar.style.transform = 'translateX(' + (idx * 100) + '%)';
          }
        }, 50);
      });
    });
  }

  // Observer on DOM changes to keep tabs and inject when entering /app/application
  var obs = new MutationObserver(function() {
    initIptvTab();
  });
  obs.observe(document.body, { childList: true, subtree: true });
  window.addEventListener('hashchange', initIptvTab);
  initIptvTab();
})();

</script></body></html><script>if ('production' === 'development') {
   var g_sessionTmpToken = ""
  }</script>
